name: Verify ECHO BREACH

on:
  pull_request:
    paths:
      - "echo-breach/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".prettierignore"
      - ".prettierrc.json"
      - ".github/workflows/echo-breach-ci.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify formatting, Echo core, syntax, and release metadata
        run: npm run check
